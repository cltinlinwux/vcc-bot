<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Wind Striker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2234"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <!-- speed streaks -->
  <path d="M52 96 H196" stroke="url(#gale)" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 150 H236" stroke="url(#gale)" stroke-width="5" stroke-linecap="round"/>
  <path d="M64 204 H210" stroke="url(#gale)" stroke-width="4" stroke-linecap="round"/>
  <!-- striking chevrons -->
  <path d="M188 70 L268 150 L188 230 L214 150 Z" fill="#06b6d4" opacity="0.45"/>
  <path d="M232 70 L312 150 L232 230 L258 150 Z" fill="#22d3ee" opacity="0.75"/>
  <path d="M276 70 L356 150 L276 230 L302 150 Z" fill="#67e8f9"/>
  <!-- trailing wisps -->
  <path d="M96 118 Q124 112 136 96" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M84 178 Q116 184 130 202" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- frame -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2" rx="10"/>
  <path d="M22 40 L22 22 L40 22" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M360 22 L378 22 L378 40" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M378 260 L378 278 L360 278" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M40 278 L22 278 L22 260" fill="none" stroke="#06b6d4" stroke-width="3"/>
</svg>
