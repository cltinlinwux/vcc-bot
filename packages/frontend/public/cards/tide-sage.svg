<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Tide Sage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2234"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <!-- floating orb -->
  <circle cx="200" cy="98" r="34" fill="none" stroke="url(#orb)" stroke-width="4"/>
  <circle cx="200" cy="98" r="20" fill="#3b82f6" opacity="0.25"/>
  <circle cx="192" cy="90" r="7" fill="#93c5fd" opacity="0.9"/>
  <!-- rising droplets -->
  <path d="M148 64 L154 74 A6 6 0 1 1 142 74 Z" fill="#60a5fa" opacity="0.7"/>
  <path d="M256 56 L261 65 A5.5 5.5 0 1 1 250 65 Z" fill="#93c5fd" opacity="0.6"/>
  <!-- tide waves -->
  <path d="M48 178 Q86 154 124 178 T200 178 T276 178 T352 178"
        fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <path d="M48 208 Q86 186 124 208 T200 208 T276 208 T352 208"
        fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M48 236 Q86 216 124 236 T200 236 T276 236 T352 236"
        fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- frame -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="2" rx="10"/>
  <path d="M22 40 L22 22 L40 22" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <path d="M360 22 L378 22 L378 40" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <path d="M378 260 L378 278 L360 278" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <path d="M40 278 L22 278 L22 260" fill="none" stroke="#3b82f6" stroke-width="3"/>
</svg>
