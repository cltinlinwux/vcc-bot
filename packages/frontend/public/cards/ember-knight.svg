<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ember Knight">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2234"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <!-- ember specks -->
  <circle cx="92" cy="72" r="3" fill="#f97316" opacity="0.5"/>
  <circle cx="318" cy="58" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="342" cy="188" r="2.5" fill="#ef4444" opacity="0.5"/>
  <circle cx="66" cy="212" r="2" fill="#fbbf24" opacity="0.4"/>
  <!-- shield -->
  <path d="M200 58 L282 88 L282 168 Q282 218 200 250 Q118 218 118 168 L118 88 Z"
        fill="none" stroke="url(#shield)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M200 76 L264 100 L264 166 Q264 204 200 230 Q136 204 136 166 L136 100 Z"
        fill="#ef4444" opacity="0.12"/>
  <!-- flame emblem -->
  <path d="M200 104 L228 152 L214 148 L222 182 L200 160 L178 182 L186 148 L172 152 Z"
        fill="url(#shield)"/>
  <path d="M200 128 L212 152 L200 168 L188 152 Z" fill="#fbbf24"/>
  <!-- frame -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#ef4444" stroke-opacity="0.35" stroke-width="2" rx="10"/>
  <path d="M22 40 L22 22 L40 22" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M360 22 L378 22 L378 40" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M378 260 L378 278 L360 278" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M40 278 L22 278 L22 260" fill="none" stroke="#ef4444" stroke-width="3"/>
</svg>
